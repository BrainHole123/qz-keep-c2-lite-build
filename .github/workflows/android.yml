name: Build QZ Keep C2 Lite Android
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DISPLAY: :99
concurrency:
  group: keep-c2-android-fast
  cancel-in-progress: false
jobs:
  android-build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free runner disk space
      run: |
        df -h /
        # Keep /usr/local/lib/android (Android SDK/NDK is used below).
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* \
          /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
        sudo docker image prune --all --force || true
        sudo apt-get clean
        df -h /
    - name: Checkout pinned QZ source
      uses: actions/checkout@v4
      with:
        repository: cagnulein/qdomyos-zwift
        ref: b6c5a7da89695aff5643f30c768e7f459cd302e2
        submodules: false
        persist-credentials: false
    - name: Checkout build inputs
      uses: actions/checkout@v4
      with:
        path: build-inputs
        persist-credentials: false
    - name: Apply reviewed C2 Lite patch
      run: 'git apply --check build-inputs/qz-patch/keep-c2-lite.patch

        git apply build-inputs/qz-patch/keep-c2-lite.patch'
    - name: Set separate Android test app identity
      run: |
        sed -i 's/applicationId = "org.cagnulen.qdomyoszwift"/applicationId = "org.cagnulen.qdomyoszwift.keepc2.fast"/' src/android/build.gradle
        sed -i 's/android:authorities="org.cagnulen.qdomyoszwift.support"/android:authorities="${applicationId}.support"/; s/android:label="QZ"/android:label="QZ C2 Lite Fast"/' src/android/AndroidManifest.xml
    - name: Checkout submodules with specific branches
      run: "git submodule init\ngit submodule update --init --recursive \n"
    - name: Install packages required to run QZ inside workflow
      timeout-minutes: 6
      run: |
        apt_sources="$(mktemp)"
        chmod 644 "$apt_sources"
        mirror=https://mirrors.edge.kernel.org/ubuntu
        for suite in jammy jammy-updates jammy-security; do
          printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe\n' "$mirror" "$suite"
        done > "$apt_sources"
        apt_options=(-o "Dir::Etc::sourcelist=$apt_sources" -o Dir::Etc::sourceparts=- \
          -o Acquire::Retries=2 -o Acquire::https::Timeout=25)
        sudo apt-get "${apt_options[@]}" update --error-on=any
        sudo apt-get "${apt_options[@]}" install -y xvfb ccache qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools qttools5-dev-tools \
          qtquickcontrols2-5-dev libqt5bluetooth5 libqt5widgets5 libqt5positioning5 libqt5xml5 qtconnectivity5-dev \
          qtpositioning5-dev libqt5charts5-dev libqt5charts5 libqt5networkauth5-dev 'libqt5websockets5*' libxcb-randr0-dev \
          libxcb-xtest0-dev libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev \
          build-essential libgl1-mesa-dev libgstreamer-gl1.0-0 libpulse-dev libxcb-glx0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
          libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb1 libxkbcommon-dev libxkbcommon-x11-0
        Xvfb -ac ${{ env.DISPLAY }} -screen 0 1280x780x24 &
    - name: Install Qt Android
      uses: jdpurcell/install-qt-action@v5
      with:
        version: 5.15.0
        host: linux
        target: android
        arch: android
        modules: qtcharts qtnetworkauth qtpurchasing
        dir: ${{ github.workspace }}/output/android/
        install-deps: 'false'
        cache: 'false'
    - name: Install custom 16K-page-size Qt (overlay onto stock Qt install)
      run: 'QT_DIR="${{ github.workspace }}/output/android/Qt/5.15.0/android"

        curl -fsSL -o /tmp/qt5.15.0-android-page16.zip https://github.com/cagnulein/qt-5.15.0-android-page16k/releases/download/1.0.1/qt5.15.0-android-page16-1.0.1.zip

        unzip -q /tmp/qt5.15.0-android-page16.zip -d /tmp/qt-page16k

        # Overlay the 16K-page-aligned target libs/plugins/qml/mkspecs/jar/include onto the

        # stock Qt install; keep the stock Linux host tools (bin/) since the custom Qt''s

        # host tools were built on macOS (Mach-O, not usable on this Linux runner).

        rsync -a --exclude=''bin/'' "/tmp/qt-page16k/qt5.15.0-android-page16/usr/local/Qt-5.15.0/" "$QT_DIR/"

        # qdevice.pri comes from the overlay carrying the macOS origin''s NDK host value;

        # fix it back to linux so qmake resolves the NDK toolchain path correctly.

        sed -i ''s/darwin-x86_64/linux-x86_64/'' "$QT_DIR/mkspecs/qdevice.pri"

        rm -rf /tmp/qt5.15.0-android-page16.zip /tmp/qt-page16k

        '
    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: patching qt for bluetooth
      run: cp qt-patches/android/5.15.0/jar/*.* ${{ github.workspace }}/output/android/Qt/5.15.0/android/jar/
    - name: download 3rd party files for qthttpserver
      run: cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/
    - name: Cache Android NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/21.1.6352462
        key: android-ndk-21.1.6352462-${{ runner.os }}
    - name: Install Android SDK packages
      run: "SDKMANAGER=\"/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager\"\necho \"y\" | $SDKMANAGER\
        \ \"ndk;21.1.6352462\" \"platforms;android-37.0\" \"build-tools;36.0.0\" --channel=3\n# API 37 is published\
        \ under android-37.0; some tools still resolve android-37.\nSDK_ROOT=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"\
        \nif [ -d \"$SDK_ROOT/platforms/android-37.0\" ] && [ ! -e \"$SDK_ROOT/platforms/android-37\" ]; then\n\
        \  ln -s android-37.0 \"$SDK_ROOT/platforms/android-37\"\nfi\n"
    - name: Setup ccache
      run: 'echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV

        ccache --set-config=max_size=2G

        ccache --set-config=compression=true

        ccache --set-config=compression_level=6

        ccache --set-config=base_dir=${{ github.workspace }}

        ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,file_macro

        ccache --zero-stats

        '
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-android-ndk21_1-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/*.pro') }}
        restore-keys: 'ccache-android-ndk21_1-

          '
    - name: Setup NDK environment with ccache
      run: "NDK_PATH=/usr/local/lib/android/sdk/ndk/21.1.6352462\nNDK_BIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin\n\
        ln -sfn $NDK_PATH /usr/local/lib/android/sdk/ndk-bundle\nrm -rf /usr/local/lib/android/sdk/ndk/25.1.8937393\n\
        echo \"ANDROID_NDK=/usr/local/lib/android/sdk/ndk-bundle\" >> $GITHUB_ENV\necho \"ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk-bundle\"\
        \ >> $GITHUB_ENV\n# Wrap NDK compilers with ccache for build caching\nif [ ! -f \"$NDK_BIN/clang.real\"\
        \ ]; then\n  mv $NDK_BIN/clang $NDK_BIN/clang.real\n  mv $NDK_BIN/clang++ $NDK_BIN/clang++.real\nfi\nprintf\
        \ '#!/bin/bash\\nexec /usr/bin/ccache %s/clang.real \"$@\"\\n' \"$NDK_BIN\" > $NDK_BIN/clang\nprintf '#!/bin/bash\\\
        nexec /usr/bin/ccache %s/clang++.real \"$@\"\\n' \"$NDK_BIN\" > $NDK_BIN/clang++\nchmod +x $NDK_BIN/clang\
        \ $NDK_BIN/clang++\n"
    - name: Prepare standalone build without service credentials
      run: |
        printf '%s\n' '#define STRAVA_SECRET_KEY' '#define PELOTON_SECRET_KEY' \
          '#define SMTP_USERNAME' '#define SMTP_PASSWORD' '#define SMTP_SERVER' \
          '#define INTERVALSICU_CLIENT_ID' '#define INTERVALSICU_CLIENT_SECRET' > src/secret.h
        printf '\n' > src/inner_templates/googlemaps/cesium-key.js
    - name: Build qthttpserver for Android
      run: 'cd src/qthttpserver

        qmake

        make -j8

        make install

        '
    - name: Build QZ for Android (arm64-v8a only)
      run: |
        lrelease src/qdomyos-zwift.pri
        # OnePlus 13T is arm64-v8a. Building one ABI keeps the runner disk
        # from filling up (the 4-ABI unstripped debug build ran out of space).
        # CONFIG+=debug keeps android-extra-libs unset with this custom Qt.
        qmake -spec android-clang 'ANDROID_ABIS=arm64-v8a' \
          'ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/21.1.6352462' 'CONFIG+=debug'
        make qmake_all
        make -j4
        make INSTALL_ROOT=${{ github.workspace }}/output/android/ install
        df -h /
        cat src/android-qdomyos-zwift-deployment-settings.json
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: '${{ github.workspace }}/.gradle-android/caches

          ${{ github.workspace }}/.gradle-android/wrapper

          '
        key: gradle-android-${{ runner.os }}-v2
        restore-keys: 'gradle-android-${{ runner.os }}-

          '
    - name: Build Android package
      run: "cd src\nmkdir -p ${{ github.workspace }}/output/android\nrsync -a --exclude build --exclude .gradle\
        \ android/ ${{ github.workspace }}/output/android/\nandroiddeployqt --input android-qdomyos-zwift-deployment-settings.json\
        \ --output ${{ github.workspace }}/output/android/ --android-platform android-37.0 --gradle --aux-mode\n\
        export GRADLE_USER_HOME=\"${{ github.workspace }}/.gradle-android\"\nexport GRADLE_OPTS=\"-Dgradle.user.home=$GRADLE_USER_HOME\"\
        \nexport GRADLE_DIST_DIR=\"${{ github.workspace }}/gradle-9.3.1\"\nexport QT_ANDROID_DIR=\"${{ github.workspace\
        \ }}/output/android/Qt/5.15.0/android\"\nmkdir -p \"$GRADLE_USER_HOME\"\nrm -f \"$GRADLE_USER_HOME/gradle.properties\"\
        \nrm -f \"$HOME/.gradle/gradle.properties\"\nfind ${{ github.workspace }}/output/android \\( -name '*.properties'\
        \ -o -name '*.gradle' -o -name '*.gradle.kts' \\) -exec sed -i '/android\\.bundle\\.enableUncompressedNativeLibs/d'\
        \ {} +\nprintf '\\nqt5AndroidDir=%s/src/android/java\\n' \"$QT_ANDROID_DIR\" >> ${{ github.workspace }}/output/android/gradle.properties\n\
        echo \"Residual enableUncompressedNativeLibs matches after sanitization:\"\nif grep -RInE \"android\\\\\
        .bundle\\\\.enableUncompressedNativeLibs|enableUncompressedNativeLibs\" ${{ github.workspace }}/output/android\
        \ \"$GRADLE_USER_HOME\" \"$HOME/.gradle\" ; then\n  echo \"Unexpected residual matches found\"\n  exit 1\n\
        fi\nfind ${{ github.workspace }}/output/android -name gradle.properties -print -exec cat {} \\;\nif [ !\
        \ -x \"$GRADLE_DIST_DIR/bin/gradle\" ]; then\n  curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip\
        \ -o /tmp/gradle-9.3.1-bin.zip\n  unzip -q /tmp/gradle-9.3.1-bin.zip -d ${{ github.workspace }}\nfi\n\"\
        $GRADLE_DIST_DIR/bin/gradle\" -g \"$GRADLE_USER_HOME\" --no-daemon -p ${{ github.workspace }}/output/android\
        \ assembleDebug\n"
    - name: Show ccache stats
      if: always()
      run: |
        if command -v ccache >/dev/null; then
          ccache --show-stats
        fi
    - name: Archive apk binary
      uses: actions/upload-artifact@v4
      with:
        name: qz-keep-c2-lite-fast-debug
        path: ${{ github.workspace }}/output/android/build/outputs/apk/debug/android-debug.apk
        retention-days: 7
        if-no-files-found: error
    timeout-minutes: 120
